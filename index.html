function loadHDRSky(){
  if(!window.hdrBase64)return;
  const binary=atob(window.hdrBase64),bytes=new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
  const blobUrl=URL.createObjectURL(new Blob([bytes],{type:'image/vnd.radiance'}));
  new RGBELoader().load(blobUrl,texture=>{
    texture.mapping=THREE.EquirectangularReflectionMapping;
    texture.wrapS=THREE.ClampToEdgeWrapping;
    texture.wrapT=THREE.ClampToEdgeWrapping;
    texture.needsUpdate=true;
    scene.background=texture;
    scene.environment=texture;
    sky.visible=false;
    URL.revokeObjectURL(blobUrl);
  },undefined,()=>URL.revokeObjectURL(blobUrl));
}

/*------sky-----*/
const C=h=>new THREE.Color(h);
const skyU={uZenith:{value:C(0x2a63c9)},uHorizon:{value:C(0xbcdffc)},uSunColor:{value:C(0xfff2dd)},uSunDir:{value:new THREE.Vector3(0,1,0)}};
const sky=new THREE.Mesh(
  new THREE.SphereGeometry(820,32,20),
  new THREE.ShaderMaterial({
    uniforms:skyU,side:THREE.BackSide,depthWrite:false,
    vertexShader:`varying vec3 vDir;void main(){vDir=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader:`uniform vec3 uZenith,uHorizon,uSunColor;uniform vec3 uSunDir;varying vec3 vDir;
      void main(){
        vec3 d=normalize(vDir);float h=d.y;
        vec3 col=mix(uHorizon,uZenith,pow(max(h,0.0),0.5));
        if(h<0.0)col=mix(uHorizon,uHorizon*0.55,clamp(-h*3.0,0.0,1.0));
        float s=max(dot(d,normalize(uSunDir)),0.0);
        col+=uSunColor*(pow(s,900.0)*1.5+pow(s,16.0)*0.20);
        gl_FragColor=vec4(col,1.0);
      }`
  })
);

/*Environment*/
const zDawn=C(0x55648f),zNoon=C(0x2a63c9),hDawn=C(0xffb37e),hNoon=C(0xbfe0fc),sDawn=C(0xffc493),sNoon=C(0xfff7e6),lDawn=C(0xffd2a4),lNoon=C(0xffffff);
const tmp1=new THREE.Color(),tmp2=new THREE.Color(),tmp3=new THREE.Color(),sunV=new THREE.Vector3();
function updateEnvironment(t){
  const a=Math.PI*(t-6)/15;
  const el=Math.max(0.04,Math.sin(a));
  sunV.set(Math.cos(a)*0.92,el,-0.42).normalize();
  const dayness=Math.pow(Math.max(Math.sin(a),0),0.6);
  skyU.uSunDir.value.copy(sunV);
  skyU.uZenith.value.copy(tmp1.copy(zDawn).lerp(zNoon,dayness));
  skyU.uHorizon.value.copy(tmp2.copy(hDawn).lerp(hNoon,dayness));
  skyU.uSunColor.value.copy(tmp3.copy(sDawn).lerp(sNoon,dayness));

  dirLight.position.copy(sunV).multiplyScalar(190);
  dirLight.color.copy(tmp1.copy(lDawn).lerp(lNoon,dayness));
  dirLight.intensity=0.35+1.55*dayness;
  hemi.intensity=0.45+0.55*dayness;
  hemi.color.copy(skyU.uHorizon.value);

}
function loadBase64GLB(base64String, callback) {
    const base64Clean = base64String.split(',')[1] || base64String;
    const binaryString = atob(base64Clean);
    const len = binaryString.length;
    const bytes = new Uint8Array(len);
    for (let i = 0; i < len; i++) {
        bytes[i] = binaryString.charCodeAt(i);
    }
    const loader = new GLTFLoader();
    loader.parse(bytes.buffer, '', (gltf) => {
        callback(gltf);
    }, (error) => {
        console.error('Erro ao carregar GLB em Base64:', error);
    });
}

function loadBase64Texture(base64String, colorSpace = THREE.NoColorSpace) {
    return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
            const canvas = document.createElement('canvas');
            canvas.width = img.width;
            canvas.height = img.height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0);
            const texture = new THREE.CanvasTexture(canvas);
            texture.colorSpace = colorSpace;
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            resolve(texture);
        };
        img.onerror = reject;
        img.src = base64String;
    });
}
let seaWaveBase=null;
function setupSeaWave(mesh){
  const positions=mesh.geometry.getAttribute('position');
  seaWaveBase={positions,x:new Float32Array(positions.count),y:new Float32Array(positions.count),z:new Float32Array(positions.count)};
  for(let i=0;i<positions.count;i++){seaWaveBase.x[i]=positions.getX(i);seaWaveBase.y[i]=positions.getY(i);seaWaveBase.z[i]=positions.getZ(i)}
}
function updateImportedSeaWaves(time,amp){
  if(!seaWaveBase)return;
  const {positions,x,y,z}=seaWaveBase;
  for(let i=0;i<positions.count;i++){
    const w=1.8*Math.sin(x[i]*0.15+time*1.4)+1.6*Math.sin(z[i]*0.18-time*1.1)+1.2*Math.sin((x[i]+z[i])*0.08+time*0.8)+1.0*Math.sin((x[i]-z[i])*0.065-time*0.55);
    positions.setY(i,y[i]+w*amp*0.8);
  }
  positions.needsUpdate=true;
}
async function createLake(){
    const baseMap = await loadBase64Texture(window.BASE, THREE.SRGBColorSpace);
    const normalMap = await loadBase64Texture(window.NORMALPNG, THREE.NoColorSpace);
    const roughMap = await loadBase64Texture(window.ROUGHPNG, THREE.NoColorSpace);
    [baseMap, normalMap, roughMap].forEach(tex => {
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(2, 2);
        tex.needsUpdate = true;
    });
    const geometry = new THREE.PlaneGeometry(1200, 1200,128,128);
    geometry.rotateX(-Math.PI / 2);
    const material = new THREE.MeshStandardMaterial({
        map: baseMap,
        normalMap: normalMap,
        roughnessMap: roughMap,
        roughness: 0.2
    });
    const mesh = new THREE.Mesh(geometry, material);
    mesh.position.set(0, -20, 150);
    scene.add(mesh);
    setupSeaWave(mesh);
    console.log("Lago criado com sucesso!"); 
}

async function createGround() {
    const diffMap = await loadBase64Texture(window.DIFF,THREE.SRGBColorSpace);
    const normalMap = await loadBase64Texture(window.NORMAL,THREE.NoColorSpace);
    const roughMap = await loadBase64Texture(window.ROUGH,THREE.NoColorSpace);
    const dispMap = await loadBase64Texture(window.DISP4K,THREE.NoColorSpace);

    // -------------------------
    // TEXTURAS
    // -------------------------
    const repeat = 5;
    for (const map of [diffMap,normalMap,roughMap,dispMap]) {
        map.wrapS = THREE.RepeatWrapping;
        map.wrapT = THREE.RepeatWrapping;
        map.repeat.set(repeat, repeat);
        map.anisotropy = renderer.capabilities.getMaxAnisotropy();
    }
    // -------------------------
    // GEOMETRIA
    // -------------------------
    const geometry = new THREE.PlaneGeometry(2800,2800,256,256
    );
    geometry.rotateX(-Math.PI / 2);
    // -------------------------
    // CAMINHO DO RIO
    // -------------------------
    const riverCurve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(-1400, 0, -300),
        new THREE.Vector3(-1000, 0, -150),
        new THREE.Vector3(-600, 0, 100),
        new THREE.Vector3(-200, 0, 0),
        new THREE.Vector3(200, 0, -150),
        new THREE.Vector3(600, 0, 100),
        new THREE.Vector3(1000, 0, 250),
        new THREE.Vector3(1400, 0, 100)
    ]);
    // -------------------------
    // DEFORMAR TERRENO
    // -------------------------
    const position = geometry.attributes.position;
    const riverWidth = 140;
    const riverDepth = 80;
    const closestPoint = new THREE.Vector3();
    for (let i = 0; i < position.count; i++) {
        const x = position.getX(i);
        const z = position.getZ(i);
        let minDistance = Infinity;
        // procura o ponto da curva mais próximo
        for (let j = 0; j <= 100; j++) {
            const t = j / 100;
            const point = riverCurve.getPointAt(t);
            const dx = x - point.x;
            const dz = z - point.z;
            const distance = Math.sqrt(
                dx * dx +
                dz * dz
            );
            if (distance < minDistance) {
                minDistance = distance;
                closestPoint.copy(point);
            }
        }
        // dentro da área de influência do rio
        if (minDistance < riverWidth) {

            const factor =
                1 - minDistance / riverWidth;

            // suaviza a margem
            const smoothFactor =
                factor * factor * (3 - 2 * factor);

            position.setY(
                i,
                -riverDepth * smoothFactor
            );
        }
    }

    position.needsUpdate = true;

    geometry.computeVertexNormals();

    // -------------------------
    // MATERIAL
    // -------------------------

    const material = new THREE.MeshStandardMaterial({

        map: diffMap,

        normalMap: normalMap,
        normalScale: new THREE.Vector2(1, 1),

        roughnessMap: roughMap,

        displacementMap: dispMap,
        displacementScale: 10,

        roughness: 0.8,
        metalness: 0

    });

    // -------------------------
    // MESH
    // -------------------------

    const mesh = new THREE.Mesh(
        geometry,
        material
    );

    mesh.position.set(0, 0, 300);

    scene.add(mesh);

    return mesh;
}

createGround();
/*Looping*/
function updateDynamics(t,time){
updateEnvironment(t);
updateImportedSeaWaves(time,1.0)
}


const clock = new THREE.Clock();
let simMin=8*60,playing=true,scrubbing=false;
function animate() {
    requestAnimationFrame(animate);

    const time = clock.elapsedTime;

    controls.update();
    updateDynamics(simMin / 60, time);

    renderer.render(scene, camera);
}
